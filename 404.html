<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Cutroom callback reroute</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #090e13; color: #f3f6f8; }
      main { width: min(720px, calc(100% - 40px)); padding: 34px; border: 1px solid #24313e; border-radius: 18px; background: #111922; }
      h1 { margin-top: 0; }
      p { color: #9cabb8; }
      a { color: #50dda6; }
      code { color: #d8e6ef; word-break: break-all; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cutroom callback reroute</h1>
      <p id="status">Trying to return to your local Cutroom app after social sign-in.</p>
      <p id="message"></p>
      <p><a id="fallback" href="https://cutroom.github.io">Open Cutroom</a></p>
    </main>
    <script>
      const path = window.location.pathname;
      const query = window.location.search;
      const queryParams = new URLSearchParams(query);
      const state = queryParams.get("state") || "";
      const status = document.getElementById("status");
      const message = document.getElementById("message");
      const fallback = document.getElementById("fallback");

      const studioCallback = /^\/oauth\/tiktok\/callback(?:\/)?$/;
      const publishingCallback = /^\/oauth\/publishing\/tiktok\/callback(?:\/)?$/;
      const isPublishing = state.startsWith("pub|") || state.startsWith("publishing|") || state.startsWith("publisher|");

      const hasQuery = query ? `${query}` : "";

      if (path === "/") {
        status.textContent = "This page is available for callback fallback support and direct OAuth return routes.";
      } else if (studioCallback.test(path) && query) {
        const localPort = isPublishing ? "8790" : "8789";
        const localCallback = `http://127.0.0.1:${localPort}/oauth/tiktok/callback${hasQuery}`;
        status.textContent = "Forwarding TikTok Studio OAuth response to the local app.";
        fallback.href = localCallback;
        message.textContent = "Local target: ";
        message.appendChild(Object.assign(document.createElement("code"), { textContent: localCallback }));
        window.setTimeout(() => window.location.replace(localCallback), 250);
      } else if (publishingCallback.test(path) && query) {
        const localCallback = `http://127.0.0.1:${isPublishing ? "8790" : "8789"}/oauth/tiktok/callback${hasQuery}`;
        status.textContent = "Forwarding TikTok Publishing OAuth response to the local app.";
        fallback.href = localCallback;
        message.textContent = "Local target: ";
        message.appendChild(Object.assign(document.createElement("code"), { textContent: localCallback }));
        window.setTimeout(() => window.location.replace(localCallback), 250);
      } else {
        status.textContent = "No callback payload was found for this path.";
        message.textContent = "Expected path: ";
        message.appendChild(
          Object.assign(document.createElement("code"), {
            textContent:
              "https://cutroom.github.io/oauth/tiktok/callback/?code=... or https://cutroom.github.io/oauth/publishing/tiktok/callback/?code=...",
          }),
        );
      }
    </script>
  </body>
</html>
