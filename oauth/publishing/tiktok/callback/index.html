<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Returning to Cutroom Publishing…</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #090e13; color: #f3f6f8; }
      main { width: min(560px, calc(100% - 40px)); padding: 34px; border: 1px solid #24313e; border-radius: 18px; background: #111922; }
      p { color: #9cabb8; }
      a { color: #50dda6; }
    </style>
  </head>
    <body>
    <main>
      <h1>Returning to Cutroom Publishing…</h1>
      <p id="status">Keep Cutroom Publishing running while the TikTok connection finishes.</p>
      <p><a id="continue" href="http://127.0.0.1:8790/accounts">Continue to Publishing</a></p>
    </main>
    <script>
      const parameters = window.location.search;
      const query = new URLSearchParams(parameters);
      const state = query.get("state") || "";
      const isStudio = (
        state.startsWith("studio|") || state.startsWith("s|") || state.startsWith("studio:")
      );
      const status = document.getElementById("status");
      const link = document.getElementById("continue");
      if (parameters) {
        const targetPort = isStudio ? "8789" : "8790";
        const localCallback = `http://127.0.0.1:${targetPort}/oauth/tiktok/callback${parameters}`;
        link.href = localCallback;
        window.setTimeout(() => window.location.replace(localCallback), 250);
      } else {
        status.textContent = "No TikTok authorization result was provided. Return to Cutroom Publishing and start the connection again.";
      }
    </script>
  </body>
</html>
